<!DOCTYPE html>
<html>
<head>
    <title>Noir Mode</title>
</head>
<body>
    <div id="NoirModeConfigPage" data-role="page" class="page type-interior pluginConfigurationPage">
        <div data-role="content">
            <div class="content-primary">
                <form id="NoirModeConfigForm">
                    <div class="sectionTitleContainer">
                        <h2 class="sectionTitle">Noir Mode</h2>
                    </div>
                    <div class="paperList" style="padding: 1em; margin-bottom: 1.5em;">
                        <div class="listItemBody">
                            <h3 class="listItemBodyText" style="margin: 0 0 .35em;">Wrapper status</h3>
                            <div class="fieldDescription" id="WrapperStatus">Loading...</div>
                        </div>
                    </div>
                    <label class="checkboxContainer">
                        <input is="emby-checkbox" type="checkbox" id="NoirEnabled" />
                        <span>Enable Noir Mode</span>
                    </label>
                    <button is="emby-button" type="submit" class="raised button-submit">
                        <span>Save settings</span>
                    </button>
                    <div>
                        <button is="emby-button" type="button" class="raised button-submit" id="ConfigureWrapper">
                            <span>Use bundled wrapper</span>
                        </button>
                        <button is="emby-button" type="button" class="raised" id="TestWrapper">
                            <span>Test wrapper</span>
                        </button>
                        <button is="emby-button" type="button" class="raised" id="RollbackWrapper">
                            <span>Restore FFmpeg</span>
                        </button>
                    </div>
                    <div class="sectionTitleContainer">
                        <h3 class="sectionTitle">Per-video override</h3>
                    </div>
                    <div class="inputContainer">
                        <label class="inputLabel" for="ItemSearch">Search videos</label>
                        <input is="emby-input" id="ItemSearch" type="text" />
                    </div>
                    <button is="emby-button" type="button" class="raised" id="SearchItems">
                        <span>Search</span>
                    </button>
                    <div class="selectContainer" id="ItemSearchResultsContainer" style="display: none;">
                        <label class="selectLabel" for="ItemSearchResults">Video</label>
                        <select is="emby-select" id="ItemSearchResults"></select>
                    </div>
                    <div class="fieldDescription" id="ItemSearchStatus"></div>
                    <div class="selectContainer">
                        <label class="selectLabel" for="PresetId">Preset</label>
                        <select is="emby-select" id="PresetId"></select>
                    </div>
                    <button is="emby-button" type="button" class="raised button-submit" id="SaveItemOverride">
                        <span>Save override</span>
                    </button>
                    <button is="emby-button" type="button" class="raised" id="ClearItemOverride">
                        <span>Clear override</span>
                    </button>
                </form>
            </div>
        </div>
        <script type="text/javascript">
            (() => {
                const page = document.querySelector('#NoirModeConfigPage');
                const api = (path, options) => ApiClient.ajax(Object.assign({
                    url: ApiClient.getUrl(path),
                    type: 'GET',
                    contentType: 'application/json'
                }, options));

                let latestConfig = {};
                let latestStatus = {};
                let selectedItemId = '';

                const read = (value, camelName, fallback) => {
                    if (!value) {
                        return fallback;
                    }

                    if (Object.prototype.hasOwnProperty.call(value, camelName)) {
                        return value[camelName];
                    }

                    const pascalName = camelName.charAt(0).toUpperCase() + camelName.slice(1);
                    if (Object.prototype.hasOwnProperty.call(value, pascalName)) {
                        return value[pascalName];
                    }

                    return fallback;
                };

                const setBusy = (button, busy) => {
                    button.disabled = busy;
                };

                const setOptions = (select, items, getValue, getLabel) => {
                    const options = items.map(item => {
                        const option = document.createElement('option');
                        option.value = getValue(item);
                        option.textContent = getLabel(item);
                        return option;
                    });
                    select.replaceChildren.apply(select, options);
                };

                const loadStatus = async () => {
                    const status = await api('NoirMode/wrapper/status');
                    latestStatus = status;
                    const enabled = read(status, 'enabled', false);
                    const jellyfinUsesWrapper = read(status, 'jellyfinUsesWrapper', false);
                    const wrapperExists = read(status, 'wrapperExists', false);

                    let text = jellyfinUsesWrapper
                        ? 'Bundled wrapper is active.'
                        : 'Bundled wrapper is not active.';

                    if (!wrapperExists) {
                        text = 'Bundled wrapper is missing for this server platform.';
                    } else if (enabled && !jellyfinUsesWrapper) {
                        text += ' Use the bundled wrapper before assigning videos.';
                    }

                    const message = read(status, 'message', '');
                    if (message) {
                        text += ' ' + message;
                    }

                    document.querySelector('#WrapperStatus').textContent = text;
                    return status;
                };

                page.addEventListener('pageshow', async () => {
                    const config = await api('NoirMode/config');
                    latestConfig = config;
                    document.querySelector('#NoirEnabled').checked = read(config, 'enabled', false);
                    await loadStatus();
                    const presets = await api('NoirMode/presets');
                    setOptions(
                        document.querySelector('#PresetId'),
                        presets,
                        preset => read(preset, 'id', ''),
                        preset => read(preset, 'label', ''));
                });

                document.querySelector('#NoirModeConfigForm').addEventListener('submit', async (event) => {
                    event.preventDefault();
                    latestConfig = await api('NoirMode/config', {
                        type: 'POST',
                        data: JSON.stringify({
                            enabled: document.querySelector('#NoirEnabled').checked,
                            allowCustomFilters: !!read(latestConfig, 'allowCustomFilters', false),
                            realFFmpegPath: read(latestConfig, 'realFFmpegPath', '') || read(latestStatus, 'realFFmpegPath', ''),
                            wrapperPath: read(latestConfig, 'wrapperPath', '') || read(latestStatus, 'wrapperPath', ''),
                            forceTranscodeNoticeShown: true
                        })
                    });
                    Dashboard.alert('Noir Mode settings saved.');
                });

                document.querySelector('#ConfigureWrapper').addEventListener('click', async () => {
                    const button = document.querySelector('#ConfigureWrapper');
                    setBusy(button, true);
                    try {
                        const status = await api('NoirMode/wrapper/install', { type: 'POST' });
                        await loadStatus();
                        Dashboard.alert(read(status, 'message', '') || 'Bundled wrapper configured.');
                    } finally {
                        setBusy(button, false);
                    }
                });

                document.querySelector('#RollbackWrapper').addEventListener('click', async () => {
                    const button = document.querySelector('#RollbackWrapper');
                    setBusy(button, true);
                    try {
                        const status = await api('NoirMode/wrapper/rollback', { type: 'POST' });
                        await loadStatus();
                        Dashboard.alert(read(status, 'message', '') || 'FFmpeg path restored.');
                    } finally {
                        setBusy(button, false);
                    }
                });

                document.querySelector('#TestWrapper').addEventListener('click', async () => {
                    const result = await api('NoirMode/wrapper/test', { type: 'POST' });
                    Dashboard.alert(read(result, 'output', '') || (read(result, 'success', false) ? 'Wrapper test passed.' : 'Wrapper test failed.'));
                });

                document.querySelector('#SaveItemOverride').addEventListener('click', async () => {
                    const itemId = selectedItemId;
                    if (!itemId) {
                        Dashboard.alert('Select a video first.');
                        return;
                    }

                    const presetId = document.querySelector('#PresetId').value;
                    await api('NoirMode/items/' + encodeURIComponent(itemId) + '/override', {
                        type: 'PUT',
                        data: JSON.stringify({ itemId, mode: 2, presetId })
                    });
                    Dashboard.alert('Noir Mode item override saved.');
                });

                document.querySelector('#SearchItems').addEventListener('click', async () => {
                    const query = encodeURIComponent(document.querySelector('#ItemSearch').value || '');
                    const items = await api('NoirMode/items/search?query=' + query);
                    const results = document.querySelector('#ItemSearchResults');
                    setOptions(
                        results,
                        items,
                        item => read(item, 'itemId', ''),
                        item => read(item, 'name', ''));

                    document.querySelector('#ItemSearchResultsContainer').style.display = items.length ? '' : 'none';
                    document.querySelector('#ItemSearchStatus').textContent = items.length
                        ? items.length + ' video' + (items.length === 1 ? '' : 's') + ' found.'
                        : 'No matching videos found.';

                    selectedItemId = '';
                    if (items.length > 0) {
                        selectedItemId = read(items[0], 'itemId', '');
                    }
                });

                document.querySelector('#ItemSearchResults').addEventListener('change', event => {
                    selectedItemId = event.target.value;
                });

                document.querySelector('#ClearItemOverride').addEventListener('click', async () => {
                    const itemId = selectedItemId;
                    if (!itemId) {
                        Dashboard.alert('Select a video first.');
                        return;
                    }

                    await api('NoirMode/items/' + encodeURIComponent(itemId) + '/override', { type: 'DELETE' });
                    Dashboard.alert('Noir Mode item override cleared.');
                });
            })();
        </script>
    </div>
</body>
</html>
